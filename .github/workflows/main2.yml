name: Build Windows EXE2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE with PyInstaller
      run: python -m PyInstaller ruokalistasuunnittelija.spec --noconfirm --onefile --distpath ./dist
      shell: cmd
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruokalistasuunnittelija-exe-${{ github.run_number }}
        path: dist/ruokalistasuunnittelija.exe
        retention-days: 30
