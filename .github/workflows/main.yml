name: Build Windows EXE

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'static/**'
      - 'requirements.txt'
      - 'ruokalistasuunnittelija.spec'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    
    - name: Display Python version
      run: python -c "import sys; print(sys.version)"
    
    - name: Install system dependencies
      run: |
        choco install tesseract -y
        setx TESSERACT_PATH "C:\Program Files\Tesseract-OCR\tesseract.exe"
      shell: powershell
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: Build EXE with PyInstaller
      run: python -m PyInstaller ruokalistasuunnittelija.spec --noconfirm --distpath ./dist
      shell: cmd
    
    - name: List dist contents
      run: dir dist\
      shell: cmd
    
    - name: Upload EXE to Release
      uses: softprops/action-gh-release@v1
      with:
        files: ./dist/ruokalistasuunnittelija.exe
        tag_name: build-${{ github.run_number }}
        name: Build ${{ github.run_number }}
        body: |
          Automatic build from commit ${{ github.sha }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ruokalistasuunnittelija-exe-${{ github.run_number }}
        path: dist/ruokalistasuunnittelija.exe
        retention-days: 30

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
    - name: Build Status
      run: |
        if [ "${{ needs.build.result }}" = "success" ]; then
          echo "✅ Build successful! EXE is ready."
        else
          echo "❌ Build failed. Check logs."
        fi
